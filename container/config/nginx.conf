user www-data;
worker_processes auto;
worker_rlimit_nofile 524288;
pid /app/run/nginx.pid;
error_log /app/logs/nginx/error.log warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Suppress only successful, marked loopback health requests. Failures stay logged.
    map "$remote_addr:$http_user_agent:$request_uri:$status" $log_request {
        default 1;
        "127.0.0.1:allaclone-health:/:200" 0;
    }

    # Record request timing and protocol without logging query strings or credentials.
    log_format site '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent h3="$http3" id=$request_id '
                    'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /app/logs/nginx/access.log site if=$log_request;

    client_body_temp_path /app/run/nginx/client_body;
    proxy_temp_path /app/run/nginx/proxy;
    fastcgi_temp_path /app/run/nginx/fastcgi;
    uwsgi_temp_path /app/run/nginx/uwsgi;
    scgi_temp_path /app/run/nginx/scgi;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost;

        # HTTP-01 renewal must remain reachable without HTTPS.
        location ^~ /.well-known/acme-challenge/ {
            root /app/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            # Published development TLS port; use :443 for production.
            return 308 https://$host:8443$request_uri;
        }
    }

    # Internal PHP homepage checks, independent of public redirects/certificates.
    # Container loopback only; this port is not published by Compose.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        include /app/config/nginx-site.conf;
    }

    include /app/config/nginx-tls.conf;
}
