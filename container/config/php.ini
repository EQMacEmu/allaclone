[PHP]
date.timezone = UTC
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /app/logs/php/error.log
zend.exception_ignore_args = On
cgi.fix_pathinfo = 0
upload_tmp_dir = /app/run/php
sys_temp_dir = /app/run/php
session.save_path = /app/data/php/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
mysqli.default_socket = /app/run/mysql/mysql.sock
pdo_mysql.default_socket = /app/run/mysql/mysql.sock
sendmail_path = /bin/false

; Debian's conf.d files load extensions before this local override.
[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
