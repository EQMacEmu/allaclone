# Self-signed certificates under /app/tls are outside Certbot's managed storage.
config-dir = /app/letsencrypt
work-dir = /app/data/certbot
logs-dir = /app/logs/certbot
max-log-backups = 60
authenticator = webroot
webroot-path = /app/acme
non-interactive = true
deploy-hook = /bin/sh /app/ops/nginx-reload.sh
