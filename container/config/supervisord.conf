[unix_http_server]
file=/app/run/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
user=root
pidfile=/app/run/supervisord.pid
logfile=/app/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
minfds=524288

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/run/supervisor.sock

; Lower priorities start first and stop last. Initialization is a separate step.
[program:mariadb]
command=/usr/sbin/mariadbd --defaults-file=/app/config/mariadb.cnf
user=mysql
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=110
killasgroup=true
stdout_logfile=/app/logs/mariadb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:php-fpm]
command=/usr/sbin/php-fpm8.4 --nodaemonize --fpm-config /app/config/php-fpm.conf
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=45
killasgroup=true
stdout_logfile=/app/logs/php-fpm-process.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /app/config/nginx.conf -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=45
killasgroup=true
stdout_logfile=/app/logs/nginx-process.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/cron.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
