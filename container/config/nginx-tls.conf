server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name localhost;

    http2 on;
    http3 on;
    quic_retry on;
    quic_host_key /app/tls/quic-host.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;

    # Local development certificate; switch these paths after Certbot issuance.
    ssl_certificate /app/tls/selfsigned.crt;
    ssl_certificate_key /app/tls/selfsigned.key;

    # Advertise the published development port. Use :443 for normal deployment.
    add_header Alt-Svc 'h3=":8443"; ma=86400' always;
    include /app/config/nginx-site.conf;
}
