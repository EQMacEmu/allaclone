root /app/www;
index index.php index.html;
add_header X-Content-Type-Options nosniff always;
add_header X-Request-ID $request_id always;

location ^~ /.well-known/acme-challenge/ {
    root /app/acme;
    default_type text/plain;
    try_files $uri =404;
}

location ~ /\. {
    return 404;
}

# Editor backup files must not expose source or configuration.
location ~ ~$ {
    return 404;
}

# These are the public assets inside includes; keep the rest private.
# Regex locations are checked in order, so this precedes the includes deny.
location ~ ^/includes/(?:[^/]+\.css|js/[^/]+\.js)$ {
    try_files $uri =404;
}

location = /config.php { return 404; }
location = /config.template.php { return 404; }
location ~ ^/(?:includes?|sql|tests|container)(?:/|$) { return 404; }
location ~* \.(?:inc|sql|ini|log|sh|bak|old|orig|save|swp)$ { return 404; }

# Only the quest directory index and its two page entrypoints are public.
location ~ ^/quests/(?!$|(?:index|zones)\.php$) { return 404; }

# Epic guides include these PHP files internally; they are not page entrypoints.
location ~ ^/guides/epics/(?:_|content(?:/|$)) { return 404; }

location / {
    try_files $uri $uri/ =404;
}

location ~ \.php$ {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass unix:/app/run/php/php-fpm.sock;
}
